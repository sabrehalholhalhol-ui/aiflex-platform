<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Flix - منصة توليد المحتوى بالذكاء الاصطناعي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }
        .btn-primary {
            background-color: #0284c7;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            transition: 0.3s;
        }
        .hero {
            text-align: center;
            padding: 50px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero h1 {
            font-size: 36px;
            margin-bottom: 15px;
            color: #f8fafc;
        }
        .hero p {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .dashboard {
            max-width: 800px;
            margin: 0 auto 60px;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            padding: 15px;
            font-size: 16px;
            resize: none;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .generate-btn {
            width: 100%;
            background-color: #10b981;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .generate-btn:hover {
            background-color: #059669;
        }
        .result-box {
            margin-top: 25px;
            text-align: center;
            display: none;
        }
        .result-box img {
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .loading {
            display: none;
            margin-top: 20px;
            color: #38bdf8;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🚀 AI Flix</div>
        <button class="btn-primary" onclick="document.getElementById('prompt-input').focus()">تجربة الاستوديو</button>
    </header>

    <section class="hero">
        <h1>صمّم وجسّد أفكارك بالذكاء الاصطناعي مجاناً 🎬</h1>
        <p>اكتب وصفك وشاهد محرك الذكاء الاصطناعي يحوله لنتيجة حقيقية أمامك في ثوانٍ!</p>
    </section>

    <section class="dashboard">
        <h2 style="margin-bottom: 15px; color: #38bdf8;">استوديو التوليد المباشر</h2>
        <textarea id="prompt-input" placeholder="اكتب وصفك هنا باللغة العربية أو الإنجليزية... (مثال: سيارة رياضية حمراء تجري في شوارع دبي ليلاً)"></textarea>
        
        <button class="generate-btn" onclick="generateContent()">⚡ توليد الآن بالذكاء الاصطناعي</button>

        <div class="loading" id="loading-spinner">
            ⏳ جاري الاتصال بمحرك الذكاء الاصطناعي وتوليد تصميمك... انتظر لحظات!
        </div>

        <div class="result-box" id="result-container">
            <h3 style="margin-bottom: 15px; color: #10b981;">تم التوليد بنجاح! 🎉</h3>
            <img id="generated-image" src="" alt="النتيجة">
        </div>
    </section>

    <script>
        function generateContent() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const loading = document.getElementById('loading-spinner');
            const resultBox = document.getElementById('result-container');
            const imgElement = document.getElementById('generated-image');

            if (!prompt) {
                alert('من فضلك اكتب وصفاً أو برومبت أولاً!');
                return;
            }

            // إظهار تحذير التحميل
            loading.style.display = 'block';
            resultBox.style.display = 'none';

            // تحويل النص لرابط Pollinations AI
            const encodedPrompt = encodeURIComponent(prompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=450&nologo=true&seed=${Math.floor(Math.random() * 1000)}`;

            // تحميل الصورة
            imgElement.src = imageUrl;
            imgElement.onload = function() {
                loading.style.display = 'none';
                resultBox.style.display = 'block';
            };
        }
    </script>

</body>
</html>
