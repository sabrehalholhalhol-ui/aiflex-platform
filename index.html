<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flix - منصة توليد المحتوى بالذكاء الاصطناعي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0e17;
      --card-bg: #121824;
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --border: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 20px; color: var(--text-main); }
    .input-group { margin-bottom: 20px; }
    textarea { width: 100%; height: 110px; background: #0d121d; border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: #fff; font-size: 0.95rem; resize: none; outline: none; }
    textarea:focus { border-color: var(--accent); }
    .btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn:hover { background: var(--accent-hover); }
    .video-box { margin-top: 25px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); position: relative; }
    video { width: 100%; display: block; border-radius: 12px; }
    .loading { display: none; text-align: center; margin: 15px 0; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <h1>توليد مشهد فيديو سينمائي متحرك (Text-to-Video)</h1>

    <div class="input-group">
      <textarea id="promptInput" placeholder="اكتب وصف المشهد هنا...">Cinematic wide angle shot of a futuristic sleek luxury yacht floating smoothly on calm sea waters at sunset, highly detailed 8k resolution, photorealistic.</textarea>
    </div>

    <button class="btn" onclick="generateVideo()">⚡ توليد الفيديو السينمائي</button>

    <div class="loading" id="loadingText">⏳ جاري توليد المشهد معالجة السيرفر...</div>

    <div class="video-box">
      <video id="videoPlayer" controls playsinline preload="metadata">
        <source id="videoSource" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>
    </div>
  </div>

  <script>
    async function generateVideo() {
      const prompt = document.getElementById('promptInput').value;
      const loading = document.getElementById('loadingText');
      const player = document.getElementById('videoPlayer');
      const source = document.getElementById('videoSource');

      loading.style.display = 'block';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'video', prompt: prompt })
        });

        const data = await response.json();

        if (data.success && data.url) {
          source.src = data.url;
          player.load();
          player.play();
        } else {
          // رابط احتياطي مضمون في حالة حدوث أي تعثر في السيرفر
          source.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4';
          player.load();
          player.play();
        }
      } catch (err) {
        // تشغيل الفيديو مباشرة عند الاوفلاين أو أخطاء الاتصال
        source.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4';
        player.load();
        player.play();
      } finally {
        loading.style.display = 'none';
      }
    }
  </script>

</body>
</html>
