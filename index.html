<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flix - منصة توليد الفيديو</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .card { width: 100%; max-width: 500px; background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; }
    h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
    textarea { width: 100%; height: 100px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 10px; padding: 12px; font-size: 1rem; outline: none; }
    button { width: 100%; margin-top: 15px; padding: 14px; background: #0284c7; color: #fff; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
    .loading { display: none; text-align: center; margin-top: 15px; color: #38bdf8; font-weight: bold; }
    .video-container { display: none; margin-top: 20px; border-radius: 10px; overflow: hidden; border: 1px solid #334155; }
    video { width: 100%; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎬 منصة AI Flix لتوليد الفيديو</h2>
    
    <label style="display:block; margin-bottom:8px;">اكتب وصف المشهد المطلوب:</label>
    <textarea id="prompt" placeholder="اكتب وصف المشهد هنا..."></textarea>

    <button onclick="generateVideo()">⚡ توليد المشهد الآن</button>

    <div class="loading" id="loader">⏳ جاري الاتصال بالذكاء الاصطناعي وتوليد المشهد...</div>

    <div class="video-container" id="videoBox">
      <video id="player" controls autoplay loop muted playsinline>
        <source id="videoSrc" src="" type="video/mp4">
      </video>
    </div>
  </div>

  <script>
    function generateVideo() {
      const promptText = document.getElementById('prompt').value;
      if(!promptText) {
        alert("من فضلك اكتب وصف المشهد أولاً!");
        return;
      }

      const loader = document.getElementById('loader');
      const videoBox = document.getElementById('videoBox');
      const player = document.getElementById('player');
      const videoSrc = document.getElementById('videoSrc');

      // إظهار التحميل وإخفاء الفيديو القديم
      loader.style.display = 'block';
      videoBox.style.display = 'none';

      // محاكاة استجابة السيرفر وعرض فيديو معاينة شغال مباشرة
      setTimeout(() => {
        loader.style.display = 'none';
        videoSrc.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
        videoBox.style.display = 'block';
        player.load();
        player.play();
      }, 2000);
    }
  </script>

</body>
</html>
