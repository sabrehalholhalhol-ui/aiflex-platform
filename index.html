<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flix - منصة الذكاء الاصطناعي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 500px; background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
    h2 { text-align: center; margin-bottom: 15px; color: #38bdf8; }
    textarea { width: 100%; height: 90px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    button { width: 100%; margin-top: 15px; padding: 12px; background: #0284c7; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .video-container { margin-top: 20px; border-radius: 10px; overflow: hidden; }
    video { width: 100%; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎬 منصة AI Flix لتوليد الفيديو</h2>
    
    <label>وصف المشهد المطلوب:</label>
    <textarea id="prompt">مشهد سينمائي لليخت الفاخر وسط البحر عند الغروب، جودة عالية جداً 8k.</textarea>

    <button onclick="playDemo()">⚡ تشغيل معاينة المشهد</button>

    <div class="video-container">
      <video id="player" controls autoplay loop muted playsinline>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <script>
    function playDemo() {
      const player = document.getElementById('player');
      player.play();
      alert("جاري المعالجة... (هنا سيتم ربط الـ API للوليد الحقيقي)");
    }
  </script>

</body>
</html>
